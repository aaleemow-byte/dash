<style>
  :root {
    --night: #1B2227; --night-2: #232C31; --night-line: #36414A;
    --amber: #FBC311; --amber-soft: #FFF3C7; --amber-ink: #6B5000;
    --paper: #F2F3F3; --card: #FFFFFF; --ink: #1B2227; --muted: #5E6A72; --line: #DCE0E2;
    --ok: #5CC08A; --err: #A33A2B; --err-soft: #FBEBE8;
    font-family: "Onest", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--night); color: var(--ink); line-height: 1.5; }
  button { font: inherit; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- приветствие ---------- */
  .hello { min-height: 100vh; background: var(--night); color: #EEF1F2; display: flex; align-items: center; }
  .hello-inner { width: 100%; max-width: 1100px; margin: 0 auto; padding: 64px 32px; }
  .hi { position: relative; display: inline-block; margin: 0; font-size: clamp(2.6rem, 7.5vw, 5.8rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
  .hi-text { display: inline-block; clip-path: inset(0 100% 0 0); }
  .beam { position: absolute; top: -10%; bottom: -10%; left: 0; width: 3px; background: var(--amber); opacity: 0;
          box-shadow: 0 0 14px 3px rgba(251,195,17,.6), 0 0 70px 14px rgba(251,195,17,.2); }
  .ask { margin: 20px 0 0; min-height: 1.5em; font-size: clamp(1.25rem, 2.6vw, 1.8rem); color: #B9C3C8; }
  .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 4px; vertical-align: -0.14em; background: var(--amber); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* после приветствия курсор гаснет */
  .caret.gone { animation: none; opacity: 0; transition: opacity .5s; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 56px; }
  @media (max-width: 720px) { .modes { grid-template-columns: 1fr; } }
  .mode { position: relative; overflow: hidden; display: grid; gap: 8px; align-content: start; text-align: left; cursor: pointer;
          color: inherit; background: rgba(35,44,49,.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--night-line); border-radius: 16px; padding: 30px 30px 26px;
          opacity: 0; transform: translateY(26px); pointer-events: none; transition: border-color .25s, background .25s; }
  .mode.in { opacity: 1; transform: none; pointer-events: auto;
             transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1), border-color .25s, background .25s; }
  .mode::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--amber); transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.2,.7,.2,1); }
  .mode:hover, .mode:focus-visible { border-color: #4A565E; background: rgba(39,49,55,.85); }
  .mode:hover::after, .mode:focus-visible::after { transform: scaleX(1); }
  .mode-name { font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; transition: color .25s; }
  .mode:hover .mode-name, .mode:focus-visible .mode-name { color: var(--amber); }
  .mode-desc { color: #AEB8BE; max-width: 38ch; }
  .mode-count { margin-top: 18px; color: #8A959C; font-size: .95rem; }
  .hello-foot { margin: 44px 0 0; color: #7F8A91; font-size: .9rem; opacity: 0; transition: opacity .8s; }
  .hello-foot.in { opacity: 1; }

  /* ---------- экран дашбордов ---------- */
  .app { position: fixed; inset: 0; overflow-y: auto; background: var(--paper); z-index: 10; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px;
         padding: 12px 20px; background: var(--night); color: #fff; border-bottom: 3px solid var(--amber); }
  .back { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--night-line); background: none; color: #fff; cursor: pointer; }
  .back:hover { border-color: var(--amber); color: var(--amber); }
  .brand { font-weight: 800; font-size: 19px; line-height: 1; letter-spacing: -0.02em; }
  .tabs { display: flex; padding: 3px; border-radius: 9px; background: #2A343A; }
  .tabs button { border: 0; background: none; color: #C3CCD1; font-weight: 600; padding: 7px 16px; border-radius: 7px; cursor: pointer; transition: background .2s, color .2s; }
  .tabs button[aria-selected="true"] { background: var(--amber); color: var(--night); }
  /* кнопка копирования пути: иконка не крупнее буквы «Ц» в логотипе шапки (~15 px),
     кликабельная зона шире за счёт отступов */
  .pathcopy { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 6px 8px; border: 0; border-radius: 6px;
              background: none; color: #AEB8BE; font-size: 13px; line-height: 1; cursor: pointer; transition: color .2s, background .2s; }
  .pathcopy svg { width: 14px; height: 14px; flex: none; color: var(--amber); }
  .pathcopy:hover { color: #fff; background: rgba(255,255,255,.06); }
  .pathcopy.done { color: var(--ok); }
  .pathcopy.done svg { color: var(--ok); }
  .folder { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: #AEB8BE; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6B767D; }
  .dot.ok { background: var(--ok); }
  .folder .link { color: var(--amber); }

  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 72px; }
  /* сетка точек под плитками: стоит на месте при прокрутке */
  .app-dots { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mode-head h2 { margin: 0; font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 800; letter-spacing: -0.025em; }
  .mode-head p { margin: 4px 0 0; color: var(--muted); }

  .access { margin: 28px 0 0; padding: 22px 24px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 12px; }
  .access h3 { margin: 0 0 6px; font-size: 1.1rem; }
  .access p { margin: 0 0 14px; max-width: 70ch; }
  .access .fine { margin: 12px 0 0; font-size: .875rem; color: var(--muted); }
  .access.error { border-left-color: var(--err); }
  .access.error h3 { color: var(--err); }
  .path { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .pathbox { font-family: "Cascadia Mono", Consolas, monospace; font-size: .92rem; color: var(--ink); text-align: left; background: var(--paper); border: 1px solid var(--line); padding: 8px 12px; border-radius: 7px; max-width: 100%; overflow-x: auto; white-space: nowrap; cursor: pointer; transition: border-color .2s, background .2s; }
  .pathbox:hover { border-color: var(--amber); background: var(--amber-soft); }
  .path.done .pathbox { border-color: var(--ok); }
  .btn { cursor: pointer; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(--amber); background: var(--amber); color: var(--night); }
  .btn:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.small { padding: 7px 12px; font-size: .9rem; }
  .link { border: 0; background: none; padding: 0; color: var(--amber-ink); text-decoration: underline; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 32px; perspective: 1100px; }
  .cell { animation: rise .65s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }

  .dash { position: relative; overflow: hidden; height: 100%; min-height: 220px; display: flex; flex-direction: column;
          background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
          transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s, border-color .3s; will-change: transform; }
  .dash::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
                  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 0%), rgba(251,195,17,.24), transparent 65%); }
  .dash::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--amber); transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .dash.ready:hover, .dash.ready:focus-within { border-color: #C9CFD2; box-shadow: 0 18px 40px -18px rgba(27,34,39,.45); }
  .dash.ready:hover::before, .dash.ready:focus-within::before { opacity: 1; }
  .dash.ready:hover::after, .dash.ready:focus-within::after { transform: scaleX(1); }
  .dash.off { opacity: .62; }

  .mark { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; background: var(--night); color: var(--amber); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; }
  .dash h3 { margin: 18px 0 6px; font-size: 1.22rem; font-weight: 700; letter-spacing: -0.01em; }
  .open { all: unset; cursor: pointer; }
  .open::after { content: ""; position: absolute; inset: 0; z-index: 1; }
  .open:focus-visible { outline: none; }
  .dash:has(.open:focus-visible) { outline: 3px solid var(--amber); outline-offset: 3px; }
  .open:disabled { cursor: default; }
  .ver { align-self: flex-start; display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-ink); font-weight: 700; font-size: .8rem; }
  .meta { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
  .meta.bad { color: var(--err); }
  .dash-foot { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; }
  .go { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .go svg { transition: transform .3s; }
  .dash.ready:hover .go svg { transform: translate(3px, -3px); }
  .dl { position: relative; z-index: 2; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .dl:hover { border-color: var(--amber); background: var(--amber-soft); }
  .skeleton { display: inline-block; width: 140px; height: .9em; border-radius: 4px; vertical-align: middle;
              background: linear-gradient(90deg, #E8EBEC 0%, #F6F7F7 50%, #E8EBEC 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }


  /* ---------- живой фон приветствия ---------- */
  .hello { position: relative; overflow: hidden; }
  .hello-inner { position: relative; z-index: 1; }
  .bg { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.8s ease; }
  .bg.on { opacity: 1; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 62vmax; height: 62vmax; right: -20vmax; top: -24vmax;
        background: radial-gradient(closest-side, rgba(251,195,17,.20), rgba(251,195,17,0));
        animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 52vmax; height: 52vmax; left: -18vmax; bottom: -26vmax;
        background: radial-gradient(closest-side, rgba(189,138,44,.17), rgba(189,138,44,0));
        animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 44vmax; height: 44vmax; left: 40%; top: 28%;
        background: radial-gradient(closest-side, rgba(96,116,128,.24), rgba(96,116,128,0));
        animation: drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-16vmax, 14vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(20vmax, -12vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-22vmax, -16vmax) scale(1.2); } }
  #dots { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- логотип ЦС ---------- */
  .cs-y { fill: #FBC311; } .cs-o { fill: #BD8A2C; } .cs-b { fill: #806026; }
  .cs-ink { fill: var(--cs-ink, #21282B); }
  .hello, .bar { --cs-ink: #FFFFFF; }
  .foot { --cs-ink: #21282B; }
  .cs-logo { display: block; overflow: visible; }
  .cs-static-g { display: none; }
  /* Логотип и надпись стоят на одной линии: низ надписи совпадает с низом «С»,
     а высота заглавных букв совпадает с высотой букв «ЦС» */
  .cs-mini { display: block; height: 40px; width: auto; flex: none; }
  .brand-wrap { display: flex; align-items: flex-end; gap: 12px; }
  .brand-wrap .brand { padding-bottom: 1px; }
  /* ---------- прыгающая кровля ----------
     roof-idle — периодический прыжок (раз в 7 с), roof-hop — прыжок при наведении */
  .roof-idle, .roof-hop { transform-box: fill-box; transform-origin: 50% 100%; }
  .alive .roof-idle { animation: roofIdle 7s ease-in-out 2s infinite; }
  .roof-hop.hop { animation: roofHop .7s ease-out; }
  @keyframes roofHop {
    0%   { transform: none; }
    15%  { transform: scale(1.05, .9); }
    42%  { transform: translateY(-11px) scale(.97, 1.04); }
    64%  { transform: translateY(0) scale(1.04, .93); }
    80%  { transform: translateY(-3px); }
    100% { transform: none; }
  }
  @keyframes roofIdle {
    0%    { transform: none; }
    1.5%  { transform: scale(1.05, .9); }
    4.2%  { transform: translateY(-11px) scale(.97, 1.04); }
    6.4%  { transform: translateY(0) scale(1.04, .93); }
    8%    { transform: translateY(-3px); }
    10%, 100% { transform: none; }
  }
  .hello-logo.alive, .brand-wrap, .foot .lockup { cursor: default; }
  @media (prefers-reduced-motion: reduce) { .alive .roof-idle, .roof-hop.hop { animation: none; } }

  /* ---------- ЦС + плашка HUB ----------
     --lh — высота монограммы; плашка по высоте равна буквам «ЦС»
     и стоит на одной линии с низом «С» */
  .lockup { --lh: 40px; display: flex; align-items: flex-end; }
  .lockup > svg { height: var(--lh); width: auto; flex: none; }
  .hub { flex: none; display: flex; align-items: center; justify-content: center;
    height: calc(var(--lh) * .368);
    margin: 0 0 calc(var(--lh) * .0954) calc(var(--lh) * .068);
    padding: 0 calc(var(--lh) * .085);
    border-radius: calc(var(--lh) * .073);
    background: #FBC311; color: #1B2227; transform-origin: 50% 60%; }
  /* HUB: Onest Black (900) + 5% толщины штриха обводкой того же цвета.
     text-box обрезает строку ровно по высоте заглавных, поэтому
     отступ от букв до верха и до низа плашки одинаковый. */
  .hub-text { display: block; font-family: "Onest", "Segoe UI", sans-serif; font-weight: 900;
    font-size: calc(var(--lh) * .3); line-height: 1; letter-spacing: .01em;
    -webkit-text-stroke: .01em currentColor; paint-order: stroke fill;
    text-box: trim-both cap alphabetic; }
  /* старые браузеры без text-box: сдвиг на разницу между полями шрифта */
  @supports not (text-box: trim-both cap alphabetic) { .hub-text { transform: translateY(.04em); } }
  .hello-logo { --lh: clamp(110px, 17vh, 150px); margin: 0 0 30px; }
  .hello-logo .hub { opacity: 0; box-shadow: 0 10px 30px -10px rgba(251,195,17,.45); }
  .hello-logo .hub.in { opacity: 1; }
  .foot { display: flex; align-items: flex-end; gap: 16px; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); }
  .foot .lockup { --lh: 40px; }
  .foot-name { font-size: 14px; line-height: 1; padding-bottom: calc(40px * .0954); padding-left: 16px; border-left: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .cs-anim-g { display: none; } .cs-static-g { display: inline; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<section id="hello" class="hello">
  <div class="bg" id="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas id="dots"></canvas></div>
  <div class="hello-inner">
    <div class="lockup hello-logo"><svg id="csLogo" class="cs-logo" viewBox="-0.3 0 113.8 146.8" role="img" aria-label="ЦС">
  <defs>
    <path id="csl-body-shape" d="M-0.225 69.793L34.175 69.793L34.175 69.793L34.175 97.286L78.894 97.286L78.894 69.793L78.894 69.793L113.293 69.793L113.293 126.707L113.293 126.707L-0.225 126.707Z"><animate attributeName="d" from="M-0.225 69.793L34.175 69.793L34.175 69.793L34.175 97.286L78.894 97.286L78.894 69.793L78.894 69.793L113.293 69.793L113.293 126.707L113.293 126.707L-0.225 126.707Z" to="M0 78.8L18.5 78.8L18.5 78.8L18.5 114.3L37 114.3L37 78.8L37 78.8L55.5 78.8L55.5 146.8L41.5 132.8L0 132.8Z" begin="0.85s" dur="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></path>
  </defs>
  <g id="csl-cs-animated" class="cs-anim-g">
    <g><g><g>
      <g id="csl-base" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.01s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0 0 1 1"/>
        <g class="roof-idle"><g class="roof-hop"><path class="cs-y" transform="scale(0.864304) translate(-122.3 0)" d="M122.04 80.75V64.7L187.7 0L253.4 64.7V80.75H213.58L187.55 55.05L161.84 80.75Z"/></g></g>
        <use id="csl-body-yellow" href="#csl-body-shape" class="cs-y" opacity="1"><animate attributeName="opacity" from="1" to="0" begin="1.95s" dur="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0 0 1 1"/></use>
      </g>
      <use id="csl-body-graphite" href="#csl-body-shape" class="cs-ink" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/></use>
      <g id="csl-lemana-pro-logo" transform="scale(0.864304) translate(-122.3 0)">
        <g id="csl-sign" opacity="1"><animate attributeName="opacity" from="1" to="0" begin="0.50s" dur="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/><path class="cs-o" d="M215.756 27.6348L192.903 60.3822L213.581 80.7534V112.561H169.273L161.841 146.605H253.376V64.6951L215.756 27.6348Z"/><path class="cs-y" d="M187.708 0L122.04 64.6996V146.602H161.841V112.559V80.751L187.708 55.2648L215.756 27.6324L187.708 0Z"/><path class="cs-b" d="M187.707 55.2671L215.755 27.6348L192.902 60.3822L187.707 55.2671Z"/><path class="cs-b" d="M161.841 112.564V146.608L169.273 112.564H161.841Z"/></g>

function isNewer(verA, fileA, verB, fileB) {
  if (verA && verB) {
    for (let i = 0; i < Math.max(verA.length, verB.length); i++) {
      const a = verA[i] || 0, b = verB[i] || 0;
      if (a !== b) return a > b;
    }
  } else if (verA && !verB) return true;
  else if (!verA && verB) return false;
  return fileA.lastModified > fileB.lastModified;

}
async function kvSet(k, v) {
  const db = await openDb();
  return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });

/* ============================================================
   ЖИВОЙ ФОН: сетка точек, которая тянется к курсору
   ============================================================ */
/* canvas — холст сетки, host — экран, на котором она живёт,
   dot — цвет точек, glow — RGB точек у курсора */
function makeDots({ canvas: cv, host, dot, glow }) {
  const ctx = cv.getContext('2d');
  const GAP = 30, RADIUS = 150;
  let w = 0, h = 0, pts = [], mx = null, my = null, tx = 0, ty = 0, pull = 0, target = 0, running = false;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = [];
    const ox = (w % GAP) / 2, oy = (h % GAP) / 2;
    for (let y = oy; y <= h; y += GAP) for (let x = ox; x <= w; x += GAP) pts.push(x, y);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    if (mx !== null) { mx += (tx - mx) * 0.12; my += (ty - my) * 0.12; }
    pull += (target - pull) * 0.07;
    ctx.fillStyle = dot;
    const near = [];
    for (let i = 0; i < pts.length; i += 2) {
      const x = pts[i], y = pts[i + 1];
      if (pull > 0.01 && mx !== null) {
        const dx = mx - x, dy = my - y, d = Math.hypot(dx, dy);
        if (d < RADIUS) { near.push(x, y, dx, dy, d); continue; }
      }
      ctx.beginPath(); ctx.arc(x, y, 1.1, 0, 6.2832); ctx.fill();
    }
    for (let i = 0; i < near.length; i += 5) {
      const k = Math.pow(1 - near[i + 4] / RADIUS, 2) * pull;
      ctx.fillStyle = `rgba(${glow},${0.1 + k * 0.75})`;
      ctx.beginPath();
      ctx.arc(near[i] + near[i + 2] * k * 0.3, near[i + 1] + near[i + 3] * k * 0.3, 1.1 + k * 1.6, 0, 6.2832);
      ctx.fill();
    }
  }

  function loop() {
    if (host.hidden) { running = false; return; }
    draw();
    if (target === 0 && pull < 0.005) { pull = 0; draw(); running = false; return; }
    /* курсор стоит, точки уже дотянулись — не перерисовываем одно и то же */
    if (Math.abs(tx - mx) < 0.3 && Math.abs(ty - my) < 0.3 && Math.abs(target - pull) < 0.005) { running = false; return; }
    requestAnimationFrame(loop);
  }
  function kick() { if (!running && !reduced) { running = true; requestAnimationFrame(loop); } }

  host.addEventListener('pointermove', e => {
    if (reduced || e.pointerType === 'touch') return;
    const r = cv.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
    if (mx === null) { mx = tx; my = ty; }
    target = 1; kick();
  });
  host.addEventListener('pointerleave', () => { target = 0; kick(); });
  new ResizeObserver(resize).observe(cv);

  return { resize };
}

  const el = $('#folderState');
  if (state.access === 'granted' && state.offline) el.innerHTML = `<span class="dot"></span><span>Диск R: недоступен</span>`;
  else if (state.access === 'granted') el.innerHTML = `<span class="dot ok"></span><span>Папка подключена</span><button class="link" data-act="repick">Сменить</button>`;
  else if (state.access === 'prompt') el.innerHTML = `<span class="dot"></span><span>Нужно подтвердить доступ</span>`;
  else el.innerHTML = `<span class="dot"></span><span>Папка не выбрана</span>`;
}

/* путь к папке: клик и по самому пути, и по кнопке копирует его */
const pathRow = () => `<div class="path"><button class="pathbox" data-act="copy" title="Нажмите, чтобы скопировать путь">${esc(CONFIG.rootPath)}</button><button class="btn ghost small" data-act="copy">Копировать путь</button></div>`;

function renderAccess() {
  const el = $('#access');
  if (!supported) {
    el.innerHTML = `<div class="access error"><h3>Этот браузер не открывает папки с диска</h3><p>Откройте страницу в Google Chrome или Microsoft Edge.</p></div>`;
    return;
  }
  if (state.access === 'granted' && state.offline) {
    el.innerHTML = `<div class="access error"><h3>Диск R: не подключён</h3>
      <p>Скопируйте путь, нажмите «Выбрать папку» и вставьте путь в адресную строку открывшегося окна.</p>
      ${pathRow()}
      <button class="btn" data-act="repick">Выбрать папку</button> <button class="btn ghost" data-act="refresh">Проверить снова</button></div>`;
    return;
  }
  if (state.access === 'granted' && !state.error) { el.innerHTML = ''; return; }
  if (state.access === 'granted' && state.error) {
    el.innerHTML = `<div class="access error"><h3>Не получилось найти файлы</h3><p>${esc(state.error)}</p>
      <button class="btn small" data-act="refresh">Проверить снова</button> <button class="btn ghost small" data-act="repick">Выбрать другую папку</button></div>`;
    return;
  }
  if (state.access === 'prompt') {
    el.innerHTML = `<div class="access"><h3>Подтвердите доступ к папке</h3>
      <p>Вы уже выбирали папку раньше. Браузеру нужно одно подтверждение, чтобы снова её открыть.</p>
      <button class="btn" data-act="connect">Разрешить доступ</button>
      <p class="fine">Не та папка? <button class="link" data-act="repick">Выбрать заново</button></p></div>`;
    return;
  }
  el.innerHTML = `<div class="access"><h3>Подключите папку с дашбордами</h3>
    <p>Скопируйте путь, нажмите «Выбрать папку» и вставьте путь в адресную строку открывшегося окна. Это нужно сделать один раз.</p>
    ${pathRow()}
    <button class="btn" data-act="connect">Выбрать папку</button>
    <p class="fine">Браузер спросит, можно ли сайту просматривать файлы в этой папке. Подтвердите, и выбор запомнится для обоих режимов.</p></div>`;
}

function tileState(d) {
  const r = (state.results[state.mode] || {})[d.id];
  if (state.access !== 'granted') return { cls: 'off', meta: '<p class="meta">Подключите папку, чтобы увидеть версию</p>', ready: false };
  if (state.loading && !r) return { cls: '', meta: '<p class="meta"><span class="skeleton"></span></p>', ready: false };
  if (state.offline) return { cls: 'off', meta: '<p class="meta bad">Диск R: недоступен</p>', ready: false };
  if (!r) return { cls: 'off', meta: `<p class="meta bad">Файл «${esc(d.prefix)}…» не найден</p>`, ready: false };
  return {
    cls: 'ready',
    meta: `<span class="ver">${r.ver ? 'v' + esc(r.ver.join('.')) : 'без версии'}</span><p class="meta">Обновлён ${fmtDate(r.file.lastModified)}</p>`,
    ready: true
  };
}

function tileInner(d) {
  const s = tileState(d);
  return {
    cls: s.cls,
    html: `
      <div class="mark">${esc(d.mark || d.title.slice(0, 2))}</div>
      <h3><button class="open" data-open="${esc(d.id)}" ${s.ready ? '' : 'disabled'}>${esc(d.title)}</button></h3>
      ${d.desc ? `<p class="meta">${esc(d.desc)}</p>` : ''}
      ${s.meta}
      <div class="dash-foot">
        <span class="go">${s.ready ? 'Открыть ' + ICON_GO : ''}</span>
        ${s.ready ? `<button class="dl" data-dl="${esc(d.id)}" aria-label="Скачать ${esc(d.title)}" title="Скачать">${ICON_DL}</button>` : ''}
      </div>`
  };
}

function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = CONFIG.modes[state.mode].dashboards.map((d, i) => {
    const t = tileInner(d);
    return `<div class="cell" style="--i:${i}"><article class="dash ${t.cls}" data-id="${esc(d.id)}">${t.html}</article></div>`;
  }).join('');
  grid.querySelectorAll('.dash').forEach(attachTilt);
}

function updateTiles() {
  const byId = Object.fromEntries(CONFIG.modes[state.mode].dashboards.map(d => [d.id, d]));
  document.querySelectorAll('#grid .dash').forEach(el => {
    const d = byId[el.dataset.id]; if (!d) return;
    const t = tileInner(d);
    el.className = 'dash ' + t.cls;
    el.innerHTML = t.html;
  });
}

/* наклон плитки за курсором и подсветка в точке курсора */
function attachTilt(el) {
  if (!finePointer || reduced) return;
  el.addEventListener('pointermove', e => {
    if (!el.classList.contains('ready')) return;
    const b = el.getBoundingClientRect();
    const px = (e.clientX - b.left) / b.width, py = (e.clientY - b.top) / b.height;
    el.style.setProperty('--mx', (px * 100) + '%');
    el.style.setProperty('--my', (py * 100) + '%');
    el.style.transform = `translateY(-6px) rotateX(${(0.5 - py) * 9}deg) rotateY(${(px - 0.5) * 11}deg)`;
  });
  el.addEventListener('pointerleave', () => { el.style.transform = ''; });
}

/* ============================================================
   РАБОТА С ПАПКОЙ И ФАЙЛАМИ
   ============================================================ */
async function connect(forcePicker) {
  try {
    if (state.root && state.access === 'prompt' && !forcePicker) {
      if ((await state.root.requestPermission({ mode: 'read' })) !== 'granted') return;
    } else {
      state.root = await window.showDirectoryPicker({ id: 'dash-root', mode: 'read' });
      await kvSet(ROOT_KEY, state.root);
      state.results = {};
    }
    state.access = 'granted'; state.error = '';
    renderApp(false);
    scan();
  } catch (e) {
    if (e.name !== 'AbortError') { state.error = 'Не удалось открыть папку: ' + e.message; state.access = state.root ? 'granted' : 'none'; renderApp(false); }
  }
}

async function scan() {
  const my = ++state.scanId, modeId = state.mode, m = CONFIG.modes[modeId];
  state.loading = true; state.error = '';
  renderAccess(); updateTiles();
  const found = {};
  let error = '', offline = false;
  try {
    let dir = state.root;
    /* сама папка на R: недоступна — компьютер не в сети компании */
    try { await dir.keys().next(); }
    catch (e) { offline = e.name !== 'NotAllowedError'; throw e; }
    for (const part of (m.folder || '').split(/[\\/]/).filter(Boolean)) dir = await dir.getDirectoryHandle(part);
    const prefixes = m.dashboards.map(d => ({ d, p: norm(d.prefix) }));
    for await (const entry of dir.values()) {
      if (entry.kind !== 'file') continue;
      const n = norm(entry.name);
      if (!/\.html?$/.test(n) || n.startsWith('~$')) continue;
      const hit = prefixes.find(x => n.startsWith(x.p));
      if (!hit) continue;
      const file = await entry.getFile();
      const ver = parseVersion(n.slice(hit.p.length));
      const cur = found[hit.d.id];
      if (!cur || isNewer(ver, file, cur.ver, cur.file)) found[hit.d.id] = { file, ver };
    }
  } catch (e) {
    if (offline) { /* сообщение покажет renderAccess */ }
    else if (e.name === 'NotFoundError') error = `В выбранной папке нет подпапки «${m.folder}». Проверьте, что выбрана папка ${CONFIG.rootPath}.`;
    else if (e.name === 'NotAllowedError') state.access = 'prompt';
    else error = 'Не удалось прочитать папку: ' + e.message;
  }
  if (my !== state.scanId) return;
  state.loading = false;
  state.offline = offline;
  state.results[modeId] = found;
  if (!error && !offline && state.access === 'granted' && Object.keys(found).length === 0)
    error = `В папке не нашлось ни одного файла этого режима. Проверьте, что выбрана папка ${CONFIG.rootPath}.`;
  state.error = error;
  renderApp(false);
}

function resultFor(id) { return (state.results[state.mode] || {})[id]; }

function openFile(id) {
  const r = resultFor(id); if (!r) return;
  const url = URL.createObjectURL(r.file);
  const w = window.open(url, '_blank');
  if (!w) location.href = url;
}
function downloadFile(id) {
  const r = resultFor(id); if (!r) return;
  const url = URL.createObjectURL(r.file);
  const a = document.createElement('a');
  a.href = url; a.download = r.file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

document.getElementById('app').addEventListener('click', async e => {
  const open = e.target.closest('[data-open]');
  if (open && !open.disabled) { openFile(open.dataset.open); return; }
  const dl = e.target.closest('[data-dl]');
  if (dl) { downloadFile(dl.dataset.dl); return; }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'connect') connect(false);
  if (a === 'repick') connect(true);
  if (a === 'refresh') scan();
  if (a === 'copy') {
    const row = act.closest('.path'), btn = row.querySelector('.btn');
    try { await navigator.clipboard.writeText(CONFIG.rootPath); btn.textContent = 'Скопировано'; row.classList.add('done'); }
    catch { btn.textContent = 'Выделите путь вручную'; }
    setTimeout(() => { btn.textContent = 'Копировать путь'; row.classList.remove('done'); }, 2000);
  }
});

/* кровля подпрыгивает при наведении на логотип */
document.querySelectorAll('.hello-logo, .brand-wrap, .foot .lockup').forEach(el => {
  el.addEventListener('pointerenter', () => {
    if (!el.classList.contains('alive') || reduced) return;
    el.querySelectorAll('.roof-hop').forEach(g => {
      g.classList.remove('hop'); void g.getBoundingClientRect(); g.classList.add('hop');
    });
  });
});
document.addEventListener('animationend', e => {
  if (e.animationName === 'roofHop') e.target.classList.remove('hop');
});

/* копирование пути из шапки */
(() => {
  const btn = document.getElementById('pathCopy'), txt = document.getElementById('pathCopyText');
  const idle = 'тык, чтобы скопировать путь';
  btn.title = CONFIG.rootPath;
  let t;
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(CONFIG.rootPath); txt.textContent = 'путь скопирован'; btn.classList.add('done'); }
    catch { txt.textContent = CONFIG.rootPath; }
    clearTimeout(t);
    t = setTimeout(() => { txt.textContent = idle; btn.classList.remove('done'); }, 2200);
  });
})();

/* кураторы могли положить новую версию, пока вкладка была в фоне */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#app').hidden && state.access === 'granted' && !state.loading) scan();
});

/* ---------- запуск ---------- */
(async function init() {
  if (supported) {
    try {
      const saved = await kvGet(ROOT_KEY);
      if (saved) {
        state.root = saved;
        state.access = (await saved.queryPermission({ mode: 'read' })) === 'granted' ? 'granted' : 'prompt';
      }
    } catch { /* сохранённой папки нет */ }
  }
  playGreeting();
})();
</script>
</body>
</html>
